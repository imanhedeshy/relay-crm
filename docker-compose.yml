services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 30"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: on-failure
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 6000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 6000
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - ./docker/kafka/log4j.properties:/etc/confluent/docker/log4j.properties.template:ro
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 30"]
      interval: 5s
      timeout: 10s
      retries: 12

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  company-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${COMPANY_DB_NAME}
      POSTGRES_USER: ${COMPANY_DB_USER}
      POSTGRES_PASSWORD: ${COMPANY_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMPANY_DB_USER} -d ${COMPANY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  crm-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CRM_DB_NAME}
      POSTGRES_USER: ${CRM_DB_USER}
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CRM_DB_USER} -d ${CRM_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  workflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${WORKFLOW_DB_NAME}
      POSTGRES_USER: ${WORKFLOW_DB_USER}
      POSTGRES_PASSWORD: ${WORKFLOW_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WORKFLOW_DB_USER} -d ${WORKFLOW_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: auth_service.settings
      SERVICE_PORT: 8000
      SERVICE_NAME: auth-service
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; import sys; sys.exit(0 if urlopen('http://localhost:8000/health/').status == 200 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${AUTH_SERVICE_PORT}:8000"

  company-service:
    build:
      context: .
      dockerfile: services/company-service/Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: company_service.settings
      SERVICE_PORT: 8000
      SERVICE_NAME: company-service
    depends_on:
      company-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; import sys; sys.exit(0 if urlopen('http://localhost:8000/health/').status == 200 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${COMPANY_SERVICE_PORT}:8000"

  crm-service:
    build:
      context: .
      dockerfile: services/crm-service/Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: crm_service.settings
      SERVICE_PORT: 8000
      SERVICE_NAME: crm-service
    depends_on:
      crm-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      company-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; import sys; sys.exit(0 if urlopen('http://localhost:8000/health/').status == 200 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${CRM_SERVICE_PORT}:8000"

  workflow-service:
    build:
      context: .
      dockerfile: services/workflow-service/Dockerfile
    restart: on-failure
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: workflow_service.settings
      SERVICE_PORT: 8000
      SERVICE_NAME: workflow-service
    depends_on:
      workflow-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      crm-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; import sys; sys.exit(0 if urlopen('http://localhost:8000/health/').status == 200 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${WORKFLOW_SERVICE_PORT}:8000"

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: on-failure
    env_file:
      - .env
    environment:
      PORT: 4000
    depends_on:
      auth-service:
        condition: service_healthy
      company-service:
        condition: service_healthy
      crm-service:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${GATEWAY_PORT}:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GRAPHQL_URL: http://localhost:${GATEWAY_PORT}/graphql
    env_file:
      - .env
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:3000"
